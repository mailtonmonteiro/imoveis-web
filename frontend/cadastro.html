<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastrar Imóvel — Imobiliária Top</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="header-top">
      <h1>Imobiliária Top</h1>
      <p class="subtitulo">Equilibrando expectativas, maximizando resultados.</p>
    </div>
    <nav>
      <a href="index.html">Home</a>
      <a href="cadastro.html" class="ativo">Cadastrar Imóveis</a>
      <a href="proprietarios.html">Proprietários</a>
      <a href="sobre.html">Sobre</a>
    </nav>
  </header>

  <main>
    <section class="card">
      <h2>Cadastrar Imóvel</h2>
      <form id="form-imovel">
        <div class="grid">
          <div class="campo">
            <label for="tipo">Tipo *</label>
            <select id="tipo" name="tipo" required>
              <option value="">Selecione...</option>
              <option value="Casa">Casa</option>
              <option value="Apartamento">Apartamento</option>
              <option value="Terreno">Terreno</option>
              <option value="Comercial">Comercial</option>
              <option value="Sítio/Chácara">Sítio/Chácara</option>
            </select>
          </div>

          <div class="campo">
            <label for="modalidade">Modalidade *</label>
            <select id="modalidade" name="modalidade" required>
              <option value="">Selecione...</option>
              <option value="venda">Venda</option>
              <option value="aluguel">Aluguel</option>
            </select>
          </div>

          <div class="campo">
            <label for="status">Status</label>
            <select id="status" name="status">
              <option value="disponível">Disponível</option>
              <option value="indisponível">Indisponível</option>
            </select>
          </div>

          <div class="campo campo-larga">
            <label for="endereco">Endereço *</label>
            <input type="text" id="endereco" name="endereco" placeholder="Rua, número" required />
          </div>

          <div class="campo">
            <label for="bairro">Bairro</label>
            <input type="text" id="bairro" name="bairro" />
          </div>

          <div class="campo">
            <label for="cidade">Cidade *</label>
            <input type="text" id="cidade" name="cidade" required />
          </div>

          <div class="campo">
            <label for="area">Área (m²)</label>
            <input type="number" id="area" name="area" min="0" step="0.01" />
          </div>

          <div class="campo">
            <label for="quartos">Quartos</label>
            <input type="number" id="quartos" name="quartos" min="0" />
          </div>

          <div class="campo">
            <label for="banheiros">Banheiros</label>
            <input type="number" id="banheiros" name="banheiros" min="0" />
          </div>

          <div class="campo">
            <label for="valor">Valor (R$) *</label>
            <input type="number" id="valor" name="valor" min="0" step="0.01" required />
          </div>

          <div class="campo campo-larga">
            <label for="descricao">Descrição</label>
            <textarea id="descricao" name="descricao" rows="3"></textarea>
          </div>
        </div>

        <button type="submit">Cadastrar Imóvel</button>
        <p id="mensagem" class="mensagem"></p>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Imobiliária Top. Todos os direitos reservados.</p>
  </footer>

  <script src="cadastro.js"></script>
</body>
</html>
