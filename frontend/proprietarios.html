<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Proprietários — Imobiliária Top</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="header-top">
      <h1>Imobiliária Top</h1>
      <p class="subtitulo">Equilibrando expectativas, maximizando resultados.</p>
    </div>
    <nav>
      <a href="index.html">Home</a>
      <a href="cadastro.html">Cadastrar Imóveis</a>
      <a href="proprietarios.html" class="ativo">Proprietários</a>
      <a href="sobre.html">Sobre</a>
    </nav>
  </header>

  <main>
    <section class="card">
      <h2>Cadastrar Proprietário</h2>
      <form id="form-proprietario">
        <div class="grid">
          <div class="campo campo-larga">
            <label for="nome">Nome *</label>
            <input type="text" id="nome" name="nome" required />
          </div>

          <div class="campo">
            <label for="cpf">CPF</label>
            <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" />
          </div>

          <div class="campo">
            <label for="telefone">Telefone</label>
            <input type="text" id="telefone" name="telefone" placeholder="(00) 00000-0000" />
          </div>

          <div class="campo">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" />
          </div>

          <div class="campo campo-larga">
            <label for="endereco">Endereço</label>
            <input type="text" id="endereco" name="endereco" placeholder="Rua, número, bairro, cidade" />
          </div>
        </div>

        <button type="submit">Cadastrar Proprietário</button>
        <p id="mensagem" class="mensagem"></p>
      </form>
    </section>

    <section class="card">
      <h2>Proprietários Cadastrados</h2>
      <table id="tabela-proprietarios">
        <thead>
          <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>CPF</th>
            <th>Telefone</th>
            <th>E-mail</th>
            <th>Endereço</th>
          </tr>
        </thead>
        <tbody id="corpo-tabela-proprietarios">
          <!-- preenchido via JavaScript -->
        </tbody>
      </table>
      <p id="sem-proprietarios" class="mensagem" style="display: none;">Nenhum proprietário cadastrado ainda.</p>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Imobiliária Top. Todos os direitos reservados.</p>
  </footer>

  <script src="proprietarios.js"></script>
</body>
</html>
